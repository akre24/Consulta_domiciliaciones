<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domiciliaciones - Sistema de Consulta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .main-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px 24px;
            text-align: center;
        }

        .main-header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .main-header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .filters-section {
            background-color: #fff;
            padding: 24px;
            border-bottom: 1px solid #e0e0e0;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #555;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        .btn-refresh {
            background-color: #4caf50;
            color: white;
        }

        .btn-refresh:hover {
            background-color: #45a049;
        }

        .records-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: #f9fafb;
            border-bottom: 1px solid #e0e0e0;
        }

        .records-count {
            font-size: 18px;
            color: #333;
        }

        .records-count span {
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        thead {
            background-color: #667eea;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background-color: #f5f7ff;
        }

        tbody tr:nth-child(even) {
            background-color: #fafbff;
        }

        td {
            padding: 12px 16px;
            font-size: 13px;
            color: #555;
        }

        .row-number {
            color: #999;
            font-weight: 500;
            width: 50px;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-data-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-message {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 16px;
            margin: 20px;
            border-radius: 6px;
        }

        .success-message {
            background-color: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
            padding: 12px;
            margin: 16px 24px;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 768px) {
            .filters {
                grid-template-columns: 1fr;
            }
            
            .main-header h1 {
                font-size: 24px;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-header">
            <h1>📊 Domiciliaciones</h1>
            <p>Sistema de Consulta de Registros</p>
        </div>

        <div id="success-message" class="success-message">
            ✅ Datos actualizados correctamente
        </div>

        <div class="filters-section">
            <div class="filters">
                <div class="filter-group">
                    <label for="matricula-filter">🎓 Matrícula</label>
                    <input type="text" id="matricula-filter" placeholder="Buscar por matrícula...">
                </div>

                <div class="filter-group">
                    <label for="email-filter">📧 Correo Electrónico</label>
                    <input type="text" id="email-filter" placeholder="Buscar por email...">
                </div>

                <div class="filter-group">
                    <label for="area-filter">📍 Área de Registro</label>
                    <input type="text" id="area-filter" placeholder="Buscar por área...">
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn btn-refresh" onclick="loadData(true)">🔄 Actualizar Datos</button>
                <button class="btn btn-secondary" onclick="clearFilters()">🧹 Limpiar Filtros</button>
                <button class="btn btn-primary" onclick="applyFilters()">🔍 Buscar</button>
            </div>
        </div>

        <div class="records-info">
            <div class="records-count">
                Registros encontrados: <span id="record-count">0</span>
            </div>
            <div id="last-update" style="font-size: 12px; color: #999;"></div>
        </div>

        <div id="loading-section" class="loading">
            <div class="spinner"></div>
            <p>Cargando datos desde Google Sheets...</p>
        </div>

        <div class="table-container" id="table-section" style="display: none;">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Marca temporal</th>
                        <th>Área de Registro</th>
                        <th>Correo Electrónico</th>
                        <th>Registro SIU</th>
                        <th>Fecha Próximo Cargo</th>
                        <th>Monto Domiciliación</th>
                        <th>Matrícula</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>

        <div id="error-section" style="display: none;"></div>
    </div>

    <script>
        // Configuración del API
        const API_URL = 'http://localhost:5000/api/data';

        let allData = [];
        let filteredData = [];

        async function loadData(showSuccessMessage = false) {
            const loadingSection = document.getElementById('loading-section');
            const tableSection = document.getElementById('table-section');
            const errorSection = document.getElementById('error-section');
            const successMessage = document.getElementById('success-message');
            
            loadingSection.style.display = 'block';
            tableSection.style.display = 'none';
            errorSection.style.display = 'none';
            successMessage.style.display = 'none';
            
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('No se encontraron datos en la hoja');
                }
                
                // Mapear los datos según los nombres de columnas de tu Sheet
                allData = data.map(item => ({
                    timestamp: item['Marca temporal'] || item.timestamp || '',
                    area: item['Area_Registro'] || item.area || '',
                    email: item['Dirección de correo electrónico'] || item.email || '',
                    registro: item['Registro_SIU'] || item.registro || '',
                    proximoCargo: item['Fecha_Proximo_Cargo'] || item.proximoCargo || '',
                    monto: item['Monto_Domiciliacion'] || item.monto || '',
                    matricula: item['Matricula2'] || item.matricula || ''
                }));
                
                applyFilters();
                updateLastUpdate();
                
                loadingSection.style.display = 'none';
                tableSection.style.display = 'block';
                
                if (showSuccessMessage) {
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 3000);
                }
                
            } catch (error) {
                console.error('Error:', error);
                loadingSection.style.display = 'none';
                errorSection.style.display = 'block';
                errorSection.innerHTML = `
                    <div class="error-message">
                        <strong>⚠️ Error al cargar los datos</strong>
                        <p>${error.message}</p>
                        <p><strong>Verifica que:</strong></p>
                        <ul style="margin-left: 20px; margin-top: 8px;">
                            <li>El servidor Python esté ejecutándose (python server.py)</li>
                            <li>El SPREADSHEET_ID esté configurado correctamente</li>
                            <li>La Service Account tenga acceso al Google Sheet</li>
                            <li>El archivo credentials.json esté en la carpeta correcta</li>
                        </ul>
                    </div>
                `;
            }
        }

        function parseDate(dateString) {
            const months = {
                'ene': 0, 'feb': 1, 'mar': 2, 'abr': 3, 'may': 4, 'jun': 5,
                'jul': 6, 'ago': 7, 'sept': 8, 'oct': 9, 'nov': 10, 'dic': 11
            };
            
            try {
                const parts = dateString.split(',');
                if (parts.length < 2) return new Date(0);
                
                const datePart = parts[0].trim().split(' ');
                const timePart = parts[1].trim();
                
                const day = parseInt(datePart[0]);
                const month = months[datePart[1].toLowerCase()];
                const year = parseInt(datePart[2]);
                
                const [hour, minute, second] = timePart.split(':').map(n => parseInt(n));
                
                return new Date(year, month, day, hour, minute, second);
            } catch (e) {
                return new Date(0);
            }
        }

        function applyFilters() {
            const matriculaFilter = document.getElementById('matricula-filter').value.toLowerCase().trim();
            const emailFilter = document.getElementById('email-filter').value.toLowerCase().trim();
            const areaFilter = document.getElementById('area-filter').value.toLowerCase().trim();

            filteredData = allData.filter(row => {
                let match = true;
                
                if (matriculaFilter && row.matricula.toLowerCase() !== matriculaFilter) {
                    match = false;
                }
                
                if (emailFilter && row.email.toLowerCase() !== emailFilter) {
                    match = false;
                }
                
                if (areaFilter && row.area.toLowerCase() !== areaFilter) {
                    match = false;
                }
                
                return match;
            });

            // Ordenar por marca temporal más reciente primero
            filteredData.sort((a, b) => {
                const dateA = parseDate(a.timestamp);
                const dateB = parseDate(b.timestamp);
                return dateB - dateA;
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="no-data">
                            <div class="no-data-icon">🔍</div>
                            <p><strong>No se encontraron registros</strong></p>
                            <p>Intenta con otros criterios de búsqueda</p>
                        </td>
                    </tr>
                `;
                updateRecordCount(0);
                return;
            }

            filteredData.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td class="row-number">${index + 1}</td>
                    <td>${row.timestamp || '-'}</td>
                    <td>${row.area || '-'}</td>
                    <td>${row.email || '-'}</td>
                    <td>${row.registro || '-'}</td>
                    <td>${row.proximoCargo || '-'}</td>
                    <td>${row.monto || '-'}</td>
                    <td>${row.matricula || '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            updateRecordCount(filteredData.length);
        }

        function updateRecordCount(count) {
            document.getElementById('record-count').textContent = count.toLocaleString('es-MX');
        }

        function updateLastUpdate() {
            const now = new Date();
            const formatted = now.toLocaleString('es-MX', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('last-update').textContent = `Última actualización: ${formatted}`;
        }

        function clearFilters() {
            document.getElementById('matricula-filter').value = '';
            document.getElementById('email-filter').value = '';
            document.getElementById('area-filter').value = '';
            applyFilters();
        }

        // Event listeners
        document.getElementById('matricula-filter').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilters();
        });

        document.getElementById('email-filter').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilters();
        });

        document.getElementById('area-filter').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilters();
        });

        // Cargar datos al iniciar
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
