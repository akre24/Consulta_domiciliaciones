<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Domiciliaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .filters {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .actions {
      padding: 0 20px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary { background: #667eea; color: white; }
    .btn-secondary { background: #e0e0e0; }
    .btn-refresh { background: #4caf50; color: white; }

    .info {
      padding: 15px 20px;
      background: #fafafa;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: #667eea;
      color: white;
      position: sticky;
      top: 0;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    tbody tr:nth-child(even) {
      background: #f7f8ff;
    }

    .error {
      background: #ffecec;
      color: #900;
      padding: 15px;
      margin: 20px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>📊 Domiciliaciones</h1>
    <p>Sistema de consulta</p>
  </header>

  <div class="filters">
    <div>
      <label>Matrícula</label>
      <input id="f-matricula" />
    </div>
    <div>
      <label>Email</label>
      <input id="f-email" />
    </div>
    <div>
      <label>Área</label>
      <input id="f-area" />
    </div>
  </div>

  <div class="actions">
    <button class="btn-refresh" onclick="loadData()">🔄 Actualizar</button>
    <button class="btn-secondary" onclick="clearFilters()">🧹 Limpiar</button>
    <button class="btn-primary" onclick="applyFilters()">🔍 Buscar</button>
  </div>

  <div class="info">
    <div>Registros: <strong id="count">0</strong></div>
    <div id="updated"></div>
  </div>

  <div id="loading" class="loading">Cargando datos…</div>
  <div id="error"></div>

  <div style="overflow:auto; max-height:600px;">
    <table id="table" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Marca temporal</th>
          <th>Área</th>
          <th>Email</th>
          <th>Registro SIU</th>
          <th>Fecha Próximo Cargo</th>
          <th>Monto</th>
          <th>Matrícula</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
/* ================= CONFIG ================= */
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/1S6T2AyI4fWA62GCbkumeV8uQg1xcB2zBf06mV5loU9c/gviz/tq?tqx=out:json&sheet=Respuestas de formulario 1";
/* ========================================= */

let allData = [];
let filteredData = [];

async function loadData() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("table").style.display = "none";
  document.getElementById("error").innerHTML = "";

  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();

    const json = JSON.parse(
      text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1)
    );

    const headers = json.table.cols.map(c => c.label);
    const rows = json.table.rows;

    allData = rows.map(r => {
      const obj = {};
      r.c.forEach((cell, i) => {
        obj[headers[i]] = cell?.v ?? "";
      });
      return {
        timestamp: obj["Marca temporal"] || "",
        area: obj["Área"] || "",
        email: obj["Dirección de correo electrónico"] || "",
        registro: obj["Registro_SIU"] || "",
        proximoCargo: obj["Fecha_Proximo_Cargo"] || "",
        monto: obj["Monto_Domiciliacion"] || "",
        matricula: obj["Matricula2"] || ""
      };
    });

    applyFilters();
    updateMeta();

    document.getElementById("loading").style.display = "none";
    document.getElementById("table").style.display = "table";

  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").innerHTML =
      `<div class="error">Error al cargar datos<br>${e.message}</div>`;
  }
}

function applyFilters() {
  const m = document.getElementById("f-matricula").value.toLowerCase();
  const e = document.getElementById("f-email").value.toLowerCase();
  const a = document.getElementById("f-area").value.toLowerCase();

  filteredData = allData.filter(r =>
    (!m || String(r.matricula).toLowerCase() === m) &&
    (!e || String(r.email).toLowerCase() === e) &&
    (!a || String(r.area).toLowerCase() === a)
  );

  renderTable();
}

function renderTable() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  filteredData.forEach((r, i) => {
    tbody.innerHTML += `
      <tr>
        <td>${i + 1}</td>
        <td>${r.timestamp}</td>
        <td>${r.area}</td>
        <td>${r.email}</td>
        <td>${r.registro}</td>
        <td>${r.proximoCargo}</td>
        <td>${r.monto}</td>
        <td>${r.matricula}</td>
      </tr>`;
  });

  document.getElementById("count").textContent = filteredData.length;
}

function updateMeta() {
  document.getElementById("updated").textContent =
    "Última actualización: " + new Date().toLocaleString("es-MX");
}

function clearFilters() {
  document.getElementById("f-matricula").value = "";
  document.getElementById("f-email").value = "";
  document.getElementById("f-area").value = "";
  applyFilters();
}

window.onload = loadData;
</script>

</body>
</html>
