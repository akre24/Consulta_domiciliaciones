<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domiciliaciones - Sistema de Consulta</title>

<style>
/* === (tu CSS intacto) === */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;padding:20px}
.container{max-width:1400px;margin:auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.loading{text-align:center;padding:40px;color:#999}
.spinner{width:40px;height:40px;border:4px solid #eee;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="container">
  <h2 style="padding:20px">📊 Domiciliaciones</h2>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Cargando datos…</p>
  </div>

  <div id="error"></div>

  <table id="table" style="display:none;width:100%">
    <thead>
      <tr>
        <th>#</th>
        <th>Marca temporal</th>
        <th>Área</th>
        <th>Email</th>
        <th>Registro SIU</th>
        <th>Fecha Próximo Cargo</th>
        <th>Monto</th>
        <th>Matrícula</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxLdFr6peWrXjPRG5Z7sFROZrv4RdW4e-5Rms2gHf3F5U6mmVvbpksSPVO9YRJcirMmwQ/exec";

let allData = [];

async function loadData() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("table").style.display = "none";
  document.getElementById("error").innerHTML = "";

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    allData = data.map(d => ({
      timestamp: d["Marca temporal"] || "",
      area: d["Area_Registro"] || "",
      email: d["Dirección de correo electrónico"] || "",
      registro: d["Registro_SIU"] || "",
      proximoCargo: d["Fecha_Proximo_Cargo"] || "",
      monto: d["Monto_Domiciliacion"] || "",
      matricula: d["Matricula2"] || ""
    }));

    render();
  } catch (e) {
    document.getElementById("error").innerHTML =
      `<p style="color:red;padding:20px">Error: ${e.message}</p>`;
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

function render() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  allData.forEach((r, i) => {
    tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${r.timestamp}</td>
        <td>${r.area}</td>
        <td>${r.email}</td>
        <td>${r.registro}</td>
        <td>${r.proximoCargo}</td>
        <td>${r.monto}</td>
        <td>${r.matricula}</td>
      </tr>`;
  });

  document.getElementById("table").style.display = "table";
}

window.onload = loadData;
</script>

</body>
</html>
